name: Daily Dashboard Update

on:
  schedule:
    # KST 11:13 / 11:37 / 11:57 (UTC 02:13 / 02:37 / 02:57) — 매일 3중 트리거
    # 정시(02:00) 회피 + GitHub Actions cron 누락 대비. 두 번 실행돼도 idempotent하므로 안전.
    - cron: '13 2 * * *'
    - cron: '37 2 * * *'
    - cron: '57 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '대상 날짜 YYYY-MM-DD (콤마/공백 구분. 비워두면 자동: 평일=어제, 월요일=금토일, 누락분 자동 백필)'
        required: false
        default: ''

concurrency:
  group: daily-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve target dates (with backfill)
        id: dates
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            DATES=$(echo "$INPUT_DATE" | tr ',' ' ')
          else
            DOW=$(TZ=Asia/Seoul date +%u)
            # 기본 — 평일: 어제, 월요일: 금토일 3일치
            if [ "$DOW" = "1" ]; then
              D1=$(TZ=Asia/Seoul date -d '3 days ago' +%Y-%m-%d)
              D2=$(TZ=Asia/Seoul date -d '2 days ago' +%Y-%m-%d)
              D3=$(TZ=Asia/Seoul date -d 'yesterday'  +%Y-%m-%d)
              DATES="$D1 $D2 $D3"
            else
              DATES=$(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d)
            fi
            # 백필 — 지난 7일 중 sales_history.json에 없는 날짜 자동 추가 (single line python으로 yaml 호환)
            BACKFILL=$(python -c "import json,os;from datetime import datetime as dt,timedelta as td;d=json.load(open('sales_history.json')) if os.path.exists('sales_history.json') else {};t=dt.utcnow()+td(hours=9);print(' '.join([(t-td(days=i)).strftime('%Y-%m-%d') for i in range(1,8) if (t-td(days=i)).strftime('%Y-%m-%d') not in d or not d.get((t-td(days=i)).strftime('%Y-%m-%d'))]))")
            if [ -n "$BACKFILL" ]; then
              DATES="$DATES $BACKFILL"
            fi
            # 중복 제거
            DATES=$(echo "$DATES" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          echo "value=$DATES" >> "$GITHUB_OUTPUT"
          echo "Target dates: $DATES"

      - name: Fetch and process each date
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          PROCESSED_ANY=0
          for D in ${{ steps.dates.outputs.value }}; do
            echo "::group::Processing $D"
            if python gdrive_fetch.py --date "$D"; then
              if [ -d "POS_DOWNLOADS/$D" ] && [ -n "$(ls -A POS_DOWNLOADS/$D 2>/dev/null)" ]; then
                python daily_report_generator.py "$D"
                PROCESSED_ANY=1
              else
                echo "[!] $D 다운로드 폴더 비어있음 — 스킵"
              fi
            else
              echo "[!] $D Drive에 파일 없음 — 스킵"
            fi
            echo "::endgroup::"
          done
          if [ "$PROCESSED_ANY" = "0" ]; then
            echo "[i] 처리된 날짜 0개"
          fi

      - name: Update index.html
        run: python update_index.py

      - name: Sync pl-library from Drive (손익 라이브러리 자동 반영)
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python - <<'PYEOF' || echo "[!] pl-library 동기화 실패 — 스킵"
          import os, io, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          FOLDER = "1Q19nlAJWpLa-FYoOOOLd0lsypBsRWjYz"  # Drive: 삼창수산_매출자료_v2/pl-library
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GDRIVE_CREDENTIALS"]),
              scopes=["https://www.googleapis.com/auth/drive.readonly"])
          svc = build("drive", "v3", credentials=creds)
          q = f"'{FOLDER}' in parents and name='pl-data.json' and trashed=false"
          fs = svc.files().list(q=q, fields="files(id,modifiedTime)").execute().get("files", [])
          if not fs:
              print("[i] Drive에 pl-data.json 없음 — 스킵")
          else:
              buf = io.BytesIO()
              dl = MediaIoBaseDownload(buf, svc.files().get_media(fileId=fs[0]["id"]))
              done = False
              while not done:
                  _, done = dl.next_chunk()
              data = buf.getvalue()
              json.loads(data.decode("utf-8"))  # 유효성 검증
              os.makedirs("pl-library", exist_ok=True)
              open("pl-library/pl-data.json", "wb").write(data)
              print(f"[OK] pl-data.json {len(data)}B 동기화")
          PYEOF


      - name: Commit and push
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@samchang-dashboard.iam.gserviceaccount.com"
          git add sales_history.json index.html pl-library/pl-data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — commit 생략 (이미 처리됨)"
          else
            git commit -m "Auto update for ${{ steps.dates.outputs.value }}"
            git push
          fi
