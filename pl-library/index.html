<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;background:#0b1220;color:#e6edf5;line-height:1.55;padding:16px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin-bottom:3px}
.sub{font-size:12px;color:#8595a8;margin-bottom:16px}
.sub b{color:#38bdf8}
.viewtabs{display:flex;gap:8px;margin-bottom:16px}
.vtab{background:#141d2e;border:1px solid #26344b;color:#9db0c8;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.vtab.on{background:linear-gradient(135deg,#1d4ed8,#0891b2);color:#fff;border-color:transparent}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.rw{display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;color:#9db0c8;font-weight:600}
select{background:#141d2e;border:1px solid #2b3a54;color:#e6edf5;padding:8px 12px;border-radius:9px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#141d2e;border:1px solid #26344b;color:#9db0c8;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.on{background:#0f2a44;color:#7dd3fc;border-color:#0ea5e9}
.card{background:#111a2b;border:1px solid #1f2a3d;border-radius:14px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:16px;font-weight:800;margin-bottom:3px}
.card .cs{font-size:12px;color:#8595a8;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#0d1626;border:1px solid #1c2941;border-radius:11px;padding:13px 15px}
.kpi .l{font-size:11.5px;color:#8595a8;font-weight:600;margin-bottom:5px}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.kpi .s{font-size:11px;color:#64748b;margin-top:2px}
.kpi .dl{font-size:11.5px;font-weight:700;margin-top:3px}
.up{color:#34d399}.down{color:#f87171}.flat{color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0d1626;color:#9db0c8;padding:8px 9px;text-align:right;font-weight:700;font-size:11.5px;border-bottom:1px solid #223049}
th:first-child{text-align:left}
td{padding:8px 9px;text-align:right;border-bottom:1px solid #18233a}
td:first-child{text-align:left;font-weight:600}
tr.tot td{background:#0d1a2b;font-weight:800;border-top:2px solid #2b4straight}
tr.tot td{background:#0d1a2b;font-weight:800}
.pos{color:#34d399}.neg{color:#f87171}
.note{font-size:12px;color:#7c8ba0;background:#0d1626;border-left:3px solid #334867;padding:9px 13px;border-radius:0 8px 8px 0;margin-top:10px}
.empty{text-align:center;color:#64748b;padding:30px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#9db0c8;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hm td,.hm th{text-align:center;padding:7px 5px;font-size:12px}
.hm td:first-child{text-align:left}
.ins{font-size:13.5px;line-height:1.7}
.ins li{margin:4px 0 4px 18px}
.ins b{color:#7dd3fc}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;margin-left:6px}
.b-best{background:#064e3b;color:#6ee7b7}.b-worst{background:#7f1d1d;color:#fca5a5}

function totrow(m){ var r=D[m].store.rows; return r[r.length-1]; }  // [합계,매출,원재료,인건,운영,고정,이익,이익률]

// ===== SVG 차트 =====
function svgBarLine(months,bars,line,opt){
  opt=opt||{}; var W=opt.w||620,H=opt.h||230,pl=42,pr=42,pt=18,pb=30;
  var iw=W-pl-pr, ih=H-pt-pb, n=months.length;
  var maxB=Math.max.apply(null,bars.concat([1]));
  var minL=Math.min.apply(null,line.concat([0])), maxL=Math.max.apply(null,line.concat([1]));
  if(minL>0)minL=0; var rangeL=maxL-minL||1;
  var bw=iw/n*0.55, s='';
  // grid
  for(var g=0;g<=4;g++){ var y=pt+ih*g/4; s+='<line x1='+pl+' y1='+y+' x2='+(W-pr)+' y2='+y+' stroke="#1c2941" stroke-width="1"/>'; s+='<text x='+(pl-6)+' y='+(y+3)+' fill="#5b6a80" font-size="9" text-anchor="end">'+Math.round(maxB*(1-g/4))+'</text>'; }
  var pts=[];
  for(var i=0;i<n;i++){
    var cx=pl+iw*(i+0.5)/n;
    var bh=ih*bars[i]/maxB, by=pt+ih-bh;
    s+='<rect x='+(cx-bw/2)+' y='+by+' width='+bw+' height='+Math.max(0,bh)+' rx=3 fill="url(#gb)"/>';
    var ly=pt+ih*(1-(line[i]-minL)/rangeL);
    pts.push([cx,ly]);
    s+='<text x='+cx+' y='+(H-10)+' fill="#8595a8" font-size="10" text-anchor="middle">'+months[i]+'</text>';
  }
  var pth=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  s+='<path d="'+pth+'" fill="none" stroke="#fbbf24" stroke-width="2.5"/>';
  pts.forEach(function(p,i){ s+='<circle cx='+p[0]+' cy='+p[1]+' r=3.5 fill="#fbbf24"/>'; s+='<text x='+p[0]+' y='+(p[1]-8)+' fill="#fcd34d" font-size="9.5" font-weight="700" text-anchor="middle">'+line[i].toFixed(opt.ldec===0?0:1)+opt.lsuf+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="gb" x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#0ea5e9"/><stop offset=1 stop-color="#1d4ed8"/></linearGradient></defs>'+s+'</svg>';
}

function svgGroup(months,series,opt){
  // series: [{name,color,data[]}]
  opt=opt||{}; var W=opt.w||620,H=opt.h||240,pl=44,pr=14,pt=16,pb=30;
  var iw=W-pl-pr, ih=H-pt-pb, n=months.length, k=series.length;
  var all=[]; series.forEach(function(s){all=all.concat(s.data);});
  var mx=Math.max.apply(null,all.concat([1])), mn=Math.min.apply(null,all.concat([0])); if(mn>0)mn=0;
  var rng=mx-mn||1, zero=pt+ih*(mx/rng);
  var s='';
  for(var g=0;g<=4;g++){ var v=mx-(mx-mn)*g/4, y=pt+ih*g/4; s+='<line x1='+pl+' y1='+y+' x2='+(W-pr)+' y2='+y+' stroke="#1c2941"/>'; s+='<text x='+(pl-6)+' y='+(y+3)+' fill="#5b6a80" font-size="9" text-anchor="end">'+Math.round(v)+'</text>'; }
  var gw=iw/n*0.62, bw=gw/k;
  for(var i=0;i<n;i++){
    var gx=pl+iw*(i+0.5)/n-gw/2;
    for(var j=0;j<k;j++){
      var val=series[j].data[i], bh=ih*Math.abs(val)/rng;
      var by=val>=0?zero-bh:zero;
      s+='<rect x='+(gx+bw*j)+' y='+by+' width='+(bw*0.86)+' height='+Math.max(1,bh)+' rx=2 fill="'+series[j].color+'"/>';
    }
    s+='<text x='+(pl+iw*(i+0.5)/n)+' y='+(H-10)+' fill="#8595a8" font-size="10" text-anchor="middle">'+months[i]+'</text>';
  }
  s+='<line x1='+pl+' y1='+zero+' x2='+(W-pr)+' y2='+zero+' stroke="#3b4d68" stroke-width="1.5"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}

function heat(v){ // 이익률 색
  if(v>=20)return '#065f46'; if(v>=12)return '#15803d'; if(v>=5)return '#3f6212';
  if(v>=0)return '#713f12'; if(v>=-10)return '#7c2d12'; return '#7f1d1d';
}

function _kpiBlock(last,prev){

  var h='<div class="card"><h2>'+last.slice(5)+'월 요약</h2><div class="cs">선택월 핵심 지표 · 전월('+prev.slice(5)+'월) 대비</div><div class="kpis">';
  h+='<div class="kpi"><div class="l">매장 매출</div><div class="v">'+t[1].toFixed(1)+'</div>'+delta(t[1],tp[1],'')+'</div>';
  h+='<div class="kpi"><div class="l">매장 영업이익</div><div class="v '+(t[6]>=0?'up':'down')+'">'+t[6].toFixed(1)+'</div>'+delta(t[6],tp[6],'')+'</div>';
  h+='<div class="kpi"><div class="l">매장 이익률</div><div class="v">'+num(t[7]).toFixed(1)+'%</div>'+delta(num(t[7]),num(tp[7]),'%p')+'</div>';
  if(D[last].tonghap){ var c=D[last].tonghap.con, cp=D[prev].tonghap?D[prev].tonghap.con:c;
    h+='<div class="kpi"><div class="l">통합 영업이익</div><div class="v '+(c>=0?'up':'down')+'">'+c.toFixed(1)+'</div>'+delta(c,cp,'')+'</div>'; }
  return h+'</div></div>';
}

  h+='<div class="note">양만장 매출원가=사료·전기·인건 등 생산원가(판관비 없음). 조합법인 매출원가=양만 매입가(장어 물량×20,000), 매출=매장 공급가(×30,000).</div></div>';
  h+= (y?renderYangman(m):'') + (j?renderJohap(m):(D[m].store?'<div class="card"><div class="empty">이 달 조합법인 손익은 미확정입니다.</div></div>':''));
  return h;
}

var cur, tab='store';
function render(){
  var h = tab==='store' ? (ovStore()+renderStore(cur)) : (ovSeg()+renderSeg(cur));
  document.getElementById('content').innerHTML=h; }

function boot(){
  MONS=Object.keys(D).sort(); ML=MONS.map(function(m){return m.slice(5)+'월';});
  cur=MONS[MONS.length-1];
  var sel=document.getElementById('mon');
  MONS.slice().reverse().forEach(function(m){var o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
  sel.value=cur; sel.addEventListener('change',function(){cur=sel.value;render();});
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.t;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b);});render();});});
  render();
}
fetch('pl-data.json?v='+Date.now()).then(function(r){return r.json();}).then(function(j){D=j;boot();}).catch(function(e){document.getElementById('content').innerHTML='<div class="card">데이터를 불러오지 못했습니다. (pl-data.json)</div>';});
</script></body></html>
